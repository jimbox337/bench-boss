name: Daily predictions

# Locks today's Bench Boss predictions before puck drop and scores yesterday's against the
# final NHL results, building a public out-of-sample track record in ml/predictions/.
#
# The record lives on the `predictions` branch, not `main`: main requires the Vercel check,
# and a commit pushed straight from a runner can never have passed it. The code runs from
# main; ml/predictions is restored from the predictions branch first and committed back there.
on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC = 10:00 ET, before the earliest regular puck drop
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  lock-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install ML dependencies
        run: |
          python -m venv ml/.venv
          ml/.venv/bin/pip install -r ml/requirements.txt

      # NHL data is not committed (ml/data is gitignored); keep it between runs so daily
      # collection stays incremental. A cold cache triggers a one-time full collection.
      - name: Restore NHL data cache
        uses: actions/cache/restore@v4
        with:
          path: ml/data
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-

      - name: Restore the track record from the predictions branch
        run: |
          if git ls-remote --exit-code --heads origin predictions >/dev/null; then
            git fetch --depth=1 origin predictions
            rm -rf ml/predictions
            git checkout FETCH_HEAD -- ml/predictions
            git reset -q
          else
            echo "No predictions branch yet; starting from main's ml/predictions"
          fi

      - name: Lock today and score yesterday
        working-directory: ml
        run: .venv/bin/python -m benchboss_ml.daily --no-pbp

      - name: Save NHL data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ml/data
          key: nhl-data-${{ github.run_id }}

      - name: Commit predictions and scores to the predictions branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dest="$RUNNER_TEMP/predictions"
          if git ls-remote --exit-code --heads origin predictions >/dev/null; then
            git fetch --depth=1 origin predictions
            git worktree add -B predictions "$dest" FETCH_HEAD
          else
            git worktree add -B predictions "$dest" HEAD
          fi
          mkdir -p "$dest/ml/predictions"
          rsync -a --delete ml/predictions/ "$dest/ml/predictions/"
          cd "$dest"
          git add -A ml/predictions
          if git diff --cached --quiet; then echo "Nothing new to commit"; exit 0; fi
          git commit -m "Daily predictions $(TZ=America/New_York date +%F)"
          git push origin HEAD:predictions
