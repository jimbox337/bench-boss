  <text x="64" y="150" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">Connect your ESPN Fantasy Hockey league</text>
  <text x="64" y="194" font-family="Arial, sans-serif" font-size="21" fill="#5b6473">Import your roster securely without copying league cookies by hand.</text>
